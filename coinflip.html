<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coin Flip</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #121212;
            color: #FFFFFF;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        .container {
            text-align: center;
            padding: 20px;
            border: 1px solid #333;
            border-radius: 8px;
            background-color: #1E1E1E;
            width: 300px;
        }

        .balance-display, .multiplier-display, .bet-display {
            margin-bottom: 20px;
            font-size: 1.2em;
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        input[type="number"] {
            padding: 8px;
            font-size: 1em;
            border: 1px solid #333;
            border-radius: 4px;
            background-color: #2A2A2A;
            color: #FFFFFF;
            width: 100%;
            box-sizing: border-box;
        }

        button {
            padding: 10px;
            font-size: 1em;
            font-weight: bold;
            border: none;
            border-radius: 4px;
            background-color: #6200EA;
            color: #FFFFFF;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #3700B3;
        }

        .result-message {
            margin-top: 20px;
            font-size: 1.2em;
        }

        .coin {
            margin: 20px auto;
            width: 100px;
            height: 100px;
            background-color: #6200EA;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #FFFFFF;
            font-size: 2em;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="balance-display">Balance: <span id="balance">1000</span></div>
        <div class="multiplier-display">Multiplier: <span id="multiplier">1.00x</span></div>
        <div class="bet-display">Bet: $<span id="current-bet-display">0</span></div>

        <div class="controls">
            <input type="number" id="bet-amount" placeholder="Enter Bet Amount" min="1">
            <button id="game-button">Flip Coin</button>
        </div>

        <div class="coin" id="coin">H</div>

        <div class="result-message" id="result-message"></div>
    </div>

    <script>
        const balanceDisplay = document.getElementById('balance');
        const multiplierDisplay = document.getElementById('multiplier');
        const currentBetDisplay = document.getElementById('current-bet-display');
        const betInput = document.getElementById('bet-amount');
        const gameButton = document.getElementById('game-button');
        const resultMessage = document.getElementById('result-message');
        const coin = document.getElementById('coin');

        let balance = 1000;
        let currentBet = 0;
        let currentMultiplier = 1;
        let gameActive = false;

        function updateBalance() {
            balanceDisplay.textContent = balance;
        }

        function updateMultiplier() {
            multiplierDisplay.textContent = `${currentMultiplier.toFixed(2)}x`;
        }

        function startGame() {
            currentBet = parseInt(betInput.value);

            if (isNaN(currentBet) || currentBet < 1 || currentBet > balance) {
                resultMessage.textContent = 'Invalid bet amount!';
                return;
            }

            balance -= currentBet;
            updateBalance();

            currentBetDisplay.textContent = currentBet;
            currentMultiplier = 1;
            updateMultiplier();

            gameActive = true;
            resultMessage.textContent = '';
            gameButton.textContent = 'Flip Again';
        }

        function flipCoin() {
            if (!gameActive) {
                startGame();
                return;
            }

            coin.textContent = '';
            coin.style.animation = 'spin 1s linear';

            setTimeout(() => {
                const outcome = Math.random() < 0.5 ? 'H' : 'T';
                const win = Math.random() < 0.5; // 50% chance to win

                coin.textContent = outcome;
                coin.style.animation = '';

                if (win) {
                    currentMultiplier *= 2;
                    const winnings = currentBet * currentMultiplier;
                    resultMessage.textContent = `You won! Multiplier: ${currentMultiplier.toFixed(2)}x`;
                    updateMultiplier();
                    currentBetDisplay.textContent = winnings;
                } else {
                    resultMessage.textContent = 'You lost! Try again!';
                    gameActive = false;
                    gameButton.textContent = 'Play Again';
                }

                if (!win) {
                    currentBet = 0;
                }
            }, 1000);
        }

        gameButton.addEventListener('click', () => {
            if (gameButton.textContent === 'Play Again') {
                gameActive = false;
                resultMessage.textContent = '';
                gameButton.textContent = 'Flip Coin';
                return;
            }

            flipCoin();
        });

        updateBalance();
        updateMultiplier();
    </script>
</body>
</html>
