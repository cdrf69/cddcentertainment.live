<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coin Flip - CDDC</title>
    <style>
        body {
            font-family: 'Courier New', monospace;
            line-height: 1.6;
            margin: 0;
            padding: 0;
            background-color: #2F2D37;
            color: #808EFF;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            width: fit-content;
            margin: auto;
            overflow: hidden;
            padding: 20px;
        }
        h1, h2 {
            color: #E380F0;
            text-align: center;
        }
        .balance-display {
            position: absolute;
            top: 10px;
            left: 10px;
            font-size: 18px;
            color: #E380F0;
        }
        .bet-display {
            font-size: 1.5em;
            color: #808EFF;
            text-align: center;
            margin-bottom: 20px;
            border: 2px solid #808EFF;
            padding: 10px;
            border-radius: 5px;
        }
        .coin-display {
            font-size: 4em;
            text-align: center;
            margin: 20px 0;
            color: #E380F0;
        }
        .controls {
            margin-top: 20px;
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        button {
            background-color: #E380F0;
            color: #2F2D37;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            font-size: 18px;
            transition: transform 0.1s ease, background-color 0.1s ease;
        }
        button:active {
            transform: scale(0.95);
            background-color: #D370D0;
        }
        input[type="number"] {
            background-color: #3D3B47;
            color: #808EFF;
            border: 2px solid #808EFF;
            padding: 5px;
            border-radius: 5px;
            width: 100px;
        }
        .back-link {
            display: block;
            margin-top: 20px;
            color: #E380F0;
            text-decoration: none;
            text-align: center;
        }
        .result {
            font-size: 2em;
            color: #E380F0;
            text-align: center;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="balance-display">Balance: <span id="balance">1000</span></div>
        <div class="bet-display">$<span id="current-bet-display">0</span></div>
        <div class="coin-display" id="coin-display">🪙</div>
        <div class="controls">
            <input type="number" id="bet-amount" placeholder="Bet Amount" min="1">
            <button id="heads-button">Heads</button>
            <button id="tails-button">Tails</button>
        </div>
        <div class="result" id="result-display"></div>
        <a href="individuals.html" class="back-link">Back to Games</a>
    </div>

    <script>
        const balanceDisplay = document.getElementById('balance');
        const betInput = document.getElementById('bet-amount');
        const coinDisplay = document.getElementById('coin-display');
        const resultDisplay = document.getElementById('result-display');
        const currentBetDisplay = document.getElementById('current-bet-display');
        const headsButton = document.getElementById('heads-button');
        const tailsButton = document.getElementById('tails-button');

        let balance = 1000;
        let currentBet = 0;

        function updateBalance() {
            balanceDisplay.textContent = balance;
        }

        function updateBetDisplay(amount) {
            currentBet = amount;
            currentBetDisplay.textContent = currentBet;
        }

        function flipCoin(userChoice) {
            if (!betInput.value || isNaN(betInput.value) || betInput.value <= 0 || betInput.value > balance) {
                resultDisplay.textContent = 'Invalid bet amount';
                return;
            }

            const betAmount = parseInt(betInput.value);
            updateBetDisplay(betAmount);
            balance -= betAmount;
            updateBalance();

            const outcomes = ['Heads', 'Tails'];
            const flipResult = outcomes[Math.floor(Math.random() * outcomes.length)];
            coinDisplay.textContent = flipResult === 'Heads' ? '🙂' : '🙃';

            if (userChoice === flipResult) {
                const winnings = betAmount * 2;
                balance += winnings;
                resultDisplay.textContent = `You won! ${flipResult}! +$${winnings}`;
            } else {
                resultDisplay.textContent = `You lost! ${flipResult}! -$${betAmount}`;
            }

            updateBalance();
        }

        headsButton.addEventListener('click', () => flipCoin('Heads'));
        tailsButton.addEventListener('click', () => flipCoin('Tails'));

        updateBalance();
    </script>
</body>
</html>
